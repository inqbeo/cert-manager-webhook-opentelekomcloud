name: CI
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The conformance suite in the root package needs a live zone and
      # credentials (see README), so only the packages below run here.
      - name: Vet, build and unit tests
        run: |
          go vet ./...
          go build ./...
          go test -race -count=1 ./pkg/...

      - uses: azure/setup-helm@v5

      - name: Lint and render the chart
        run: |
          helm lint charts/cert-manager-webhook-opentelekomcloud
          helm template ci charts/cert-manager-webhook-opentelekomcloud > /dev/null

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
